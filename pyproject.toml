[project]
name = "memex-chats"
version = "0.1.0"
description = "Local MCP server that indexes your Claude.ai chats and exposes them to Claude Code (and, soon, to Claude.ai via remote MCP)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Dionisio Pereyra", email = "dionipereyrab@gmail.com" }]
keywords = ["mcp", "claude", "claude-code", "memory", "rag", "embeddings", "sqlite", "sqlite-vec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "fastmcp>=0.2.0",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
ollama = ["ollama>=0.3.0"]
summaries = ["anthropic>=0.40"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "ollama>=0.3.0",
    "anthropic>=0.40",
]

[project.scripts]
memex = "memex.cli.main:app"
memex-mcp = "memex.transports.stdio:main"

[project.urls]
Homepage = "https://github.com/dioniipereyraa/memex"
Repository = "https://github.com/dioniipereyraa/memex"
Issues = "https://github.com/dioniipereyraa/memex/issues"
Changelog = "https://github.com/dioniipereyraa/memex/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memex"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/memex/core"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: tests that require external services (Ollama, etc.)",
]
